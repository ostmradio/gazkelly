media:
  input: img
  output: /img
  categories: [image]
  rename: safe

content:
  - name: performances
    label: Performances
    type: file
    path: data/performances.json
    format: json
    list: true
    fields:
      - name: id
        label: ID
        type: uuid
        description: Automatically generated internal ID. You do not need to change this.
        options:
          editable: false
      - name: title
        label: Performance title
        type: string
        required: true
      - name: date
        label: Date and time
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"
      - name: venue
        label: Venue
        type: string
        required: true
      - name: location
        label: Location
        type: string
        required: true
      - name: details
        label: Additional details
        type: text
      - name: ticketUrl
        label: Ticket link
        type: string
      - name: image
        label: Promotional image
        type: image
      - name: published
        label: Show on website
        type: boolean
        default: true

  - name: releases
    label: Music Releases
    type: file
    path: data/releases.json
    format: json
    list: true
    fields:
      - name: id
        label: ID
        type: uuid
        description: Automatically generated internal ID. You do not need to change this.
        options:
          editable: false
      - name: title
        label: Release title
        type: string
        required: true
      - name: releaseType
        label: Release type
        type: string
        required: true
      - name: releaseDate
        label: Release date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: artwork
        label: Artwork
        type: image
        required: true
      - name: listenUrl
        label: Streaming link
        type: string
        required: true
      - name: published
        label: Show on website
        type: boolean
        default: true

  - name: notification
    label: Website Notification
    type: file
    path: data/notification.json
    format: json
    fields:
      - name: enabled
        label: Show notification
        type: boolean
        default: false
        description: Turn this on to display the notification across the website.
      - name: id
        label: Notification ID
        type: string
        required: true
        description: Change this when publishing a new notification so visitors who dismissed the previous one will see it.
      - name: label
        label: Short label
        type: string
        description: Optional short text such as NEW or BUY NOW!
      - name: message
        label: Message
        type: text
        required: true
      - name: url
        label: Link
        type: string
        description: Optional page to open when the notification is selected.
      - name: delay
        label: Delay in milliseconds
        type: number
        default: 500
        description: 500 displays the notification half a second after the page loads.
