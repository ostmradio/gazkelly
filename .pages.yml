media:
  input: img
  output: /img
  categories: [image]
  rename: safe

content:
  - name: performances
    label: Performances
    type: file
    path: data/performances.json
    format: json
    list: true
    fields:
      - name: id
        label: ID
        type: uuid
        description: Automatically generated internal ID. You do not need to change this.
        options:
          editable: false
      - name: title
        label: Performance title
        type: string
        required: true
      - name: date
        label: Date and time
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"
      - name: venue
        label: Venue
        type: string
        required: true
      - name: location
        label: Location
        type: string
        required: true
      - name: details
        label: Additional details
        type: text
      - name: ticketUrl
        label: Ticket link
        type: string
      - name: image
        label: Promotional image
        type: image
      - name: published
        label: Show on website
        type: boolean
        default: true

  - name: releases
    label: Music Releases
    type: file
    path: data/releases.json
    format: json
    list: true
    fields:
      - name: id
        label: ID
        type: uuid
        description: Automatically generated internal ID. You do not need to change this.
        options:
          editable: false
      - name: title
        label: Release title
        type: string
        required: true
      - name: releaseType
        label: Release type
        type: string
        required: true
      - name: releaseDate
        label: Release date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: artwork
        label: Artwork
        type: image
        required: true
      - name: listenUrl
        label: Streaming link
        type: string
        required: true
      - name: published
        label: Show on website
        type: boolean
        default: true
