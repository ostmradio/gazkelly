<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="refresh" content="0; url=https://app.pagescms.org" />
    <title>Website Admin | Gaz Kelly</title>
    <link rel="canonical" href="https://app.pagescms.org" />
    <style>
        :root {
            color-scheme: dark;
            font-family: Arial, Helvetica, sans-serif;
            background: #080808;
            color: #f5f3f3;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        main {
            max-width: 560px;
            text-align: center;
        }

        .eyebrow {
            margin: 0 0 18px;
            color: #ff4f91;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 16px;
            font-size: clamp(2rem, 8vw, 4rem);
            line-height: 0.95;
        }

        p {
            margin: 0;
            color: #aaa5a7;
            line-height: 1.6;
        }

        a {
            color: #ff77aa;
        }
    </style>
</head>
<body>
<main>
    <p class="eyebrow">Gaz Kelly website</p>
    <h1>Opening the content editor…</h1>
    <p>
        If you are not redirected automatically,
        <a href="https://app.pagescms.org">open Pages CMS</a>.
    </p>
</main>
</body>
</html>
